packages:
  - apps/api
  - apps/mobile
  - packages/domain

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  workerd: false

# Keep local and CI installs on the same node_modules layout.
enableGlobalVirtualStore: false

patchedDependencies:
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch

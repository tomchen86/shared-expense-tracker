name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This name is the required status check in .github/rulesets/main-integrity.json.
    name: check
    # A template repository has no project to check yet.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    # The API's tests connect to it. Same port and major version as apps/api/compose.yaml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Jest keeps every file as it transformed and instrumented it in /tmp/jest_<uid>, so
      # with the last run's cache the first test of each platform need not transform the
      # whole app again. A file whose content changed misses and is transformed anew.
      - name: Restore Jest's cache
        id: jest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jest_*
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            jest-${{ runner.os }}-
      - name: Lint, format check, typecheck, tests, requirement trace
        # The runner has four CPUs. `pnpm test` keeps two workers wherever this is not set,
        # since a developer's machine runs other things too.
        env:
          JEST_MAX_WORKERS: 4
        run: bash scripts/check.sh
      - name: Save Jest's cache
        if: ${{ !cancelled() && steps.jest-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jest_*
          key: ${{ steps.jest-cache.outputs.cache-primary-key }}
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

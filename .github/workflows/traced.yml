name: traced

# Traced coverage on demand (review-pr step 6).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traced:
    name: traced
    # A template repository has no project to check yet.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    # The API's tests connect to it. Same port and major version as apps/api/compose.yaml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Traced coverage
        run: pnpm test:traced
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage/
          if-no-files-found: ignore

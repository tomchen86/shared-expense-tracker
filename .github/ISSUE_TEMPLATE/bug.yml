name: Bug
description: The system does not do what a requirement says
labels: [bug]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      description: The requirement this breaks, e.g. LEDGER-2.1. If no requirement covers it, this is a missing rule; file a feature instead.
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce

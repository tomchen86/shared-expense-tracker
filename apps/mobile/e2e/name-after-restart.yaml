appId: com.tomchen.sharedexpensetracker
name: Keeps the saved name after a restart
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible:
    text: Settings
    selected: true
- tapOn:
    id: settings-name
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible:
    id: settings-name
    text: Taylor

# On Android, scrolls the capsule row back to its start with a drag from the capsule named FROM,
# so the first capsules are on screen again (LEDGER-133.2). iOS shows the whole row. Not a flow of
# its own: Maestro runs only the files at the top of a folder.
appId: com.tomchen.sharedexpensetracker
---
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            text: ${FROM}
          direction: RIGHT
      - waitForAnimationToEnd

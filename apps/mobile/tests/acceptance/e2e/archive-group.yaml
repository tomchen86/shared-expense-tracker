appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-47.1] [GROUPS-48.1] [GROUPS-49.1] [GROUPS-51.1] [GROUPS-52.1] [GROUPS-53.2] [GROUPS-54.1] [GROUPS-55.2] [GROUPS-57.1] [GROUPS-60.1] Archives a group by swiping its card, keeps it archived after a restart, then restores it from its screen on the Settings tab'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Groups
- tapOn: Add group
- assertVisible: New Group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
# Swiping the card to the left shows its Archive button.
- swipe:
    from:
      text: Open Brisbane
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Archive Brisbane
- assertVisible: Group archived · Find it in Settings
- assertNotVisible: Open Brisbane
- assertVisible: No groups yet. Tap + to create a group.
# The notice goes after 4.5 seconds.
- extendedWaitUntil:
    notVisible: Group archived · Find it in Settings
    timeout: 10000
# The archive is in expo-sqlite, so it is still there after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Groups
- assertVisible: No groups yet. Tap + to create a group.
- tapOn: Settings
- tapOn: Archived groups, 1
- assertVisible: Restore Brisbane
- tapOn: Open Brisbane
- assertVisible: Archived group. Expenses and allocations are read-only.
- tapOn: Restore Group
- waitForAnimationToEnd
- assertNotVisible: Archived group. Expenses and allocations are read-only.
- assertNotVisible: Restore Group
- tapOn: Back
- assertVisible: No archived groups.
- tapOn: Groups
- assertVisible: Open Brisbane

appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-47.1] [GROUPS-48.1] [GROUPS-49.1] [GROUPS-60.1] Archives a group by swiping its card left, with a notice, and keeps it archived after a restart'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane"}]}'
- tapOn: Groups
- waitForAnimationToEnd
# Swiping the card to the left shows its Archive button.
- swipe:
    from:
      text: Open Brisbane
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Archive Brisbane
- assertVisible: Group archived · Find it in Settings
- assertNotVisible: Open Brisbane
- assertVisible: No groups yet. Tap + to create a group.
# The notice goes after 4.5 seconds.
- extendedWaitUntil:
    notVisible: Group archived · Find it in Settings
    timeout: 10000
# The archive is in expo-sqlite, so it is still there after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Groups
- assertVisible: No groups yet. Tap + to create a group.

appId: com.tomchen.sharedexpensetracker
name: "[LEDGER-68.2] [GROUPS-64.1] [LEDGER-46.2] [LEDGER-48.2] [LEDGER-49.2] [LEDGER-62.2] [LEDGER-54.1] [GROUPS-61.3] [LEDGER-65.4] [LEDGER-70.2] [LEDGER-88.1] [GROUPS-80.1] [LEDGER-75.3] [LEDGER-77.3] [LEDGER-78.3] [LEDGER-79.3] [LEDGER-84.1] [LEDGER-67.2] Adds a group expense from the group's screen, with a category added over the form, then finds it on the group's screen at its full amount and on Expenses at your share; swipes its card left to move it to the trash on both, finds that swiping its card on Trash opens nothing, restores it, archives the group, and finds that swiping its card opens nothing"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Groups
- tapOn: Add group
- assertVisible: New Group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- tapOn: Open Brisbane
- tapOn: Group actions
- tapOn: Members
- waitForAnimationToEnd
- tapOn: Add Member
- waitForAnimationToEnd
# The name field in Members has the focus, so the keyboard types into it.
- inputText: Casey
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: Casey
- swipe:
    from:
      text: Members
    direction: DOWN
- waitForAnimationToEnd
# The group's screen has a + button of its own, which opens New Expense for the group.
- tapOn: Add expense
- waitForAnimationToEnd
- assertVisible: New Expense
- assertVisible: Group, Brisbane
- tapOn: Amount in .*
- inputText: '100.01'
- tapOn: Expense title
- inputText: Dinner
# Add stays disabled until the payer and the split are chosen, so only the
# category form's Add is enabled while Group Categories is open.
- tapOn: Category, Food & Dining
- waitForAnimationToEnd
- tapOn: \+ Add New Category
- waitForAnimationToEnd
- assertVisible: New Category
- tapOn: Category name
- inputText: Flights
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Category
- assertVisible: New Expense
- assertVisible: Dinner
- assertVisible: Category, Flights
# Where the simulator shows the software keyboard, it covers the rows below Date, and iOS still
# reports them as visible, so scrollUntilVisible would not scroll and the next press would land
# on the keyboard. A press on the form's margin closes it first.
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
# Bring all financial rows into view before opening their pickers. Returning from
# Paid by must still leave Split between directly usable, with no further scroll.
- scrollUntilVisible:
    element: Split between, Choose people
    direction: DOWN
# Choosing the group the form already has closes Select Group and keeps the inputs.
- tapOn: Group, Brisbane
- waitForAnimationToEnd
- tapOn:
    text: Brisbane
    selected: true
- waitForAnimationToEnd
- assertVisible: Group, Brisbane
- assertVisible: Dinner
- assertVisible: Category, Flights
- tapOn: Paid by, not selected
- waitForAnimationToEnd
- tapOn: Casey
- waitForAnimationToEnd
- assertVisible: Paid by, Casey
- assertVisible: Dinner
- tapOn: Split between, Choose people
- waitForAnimationToEnd
- tapOn: Taylor \(You\)
- waitForAnimationToEnd
- tapOn: Casey
- waitForAnimationToEnd
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Split between, 2 people
- assertVisible: Dinner
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Expense
# Back on Brisbane's screen: its card shows the full amount.
- assertVisible: .*Dinner.*\$100\.01.*
# Dragging up from an open card bounces this short list, which closes the card.
- swipe:
    from:
      text: .*Dinner.*\$100\.01.*
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: Delete Dinner expense
- swipe:
    from:
      text: .*Dinner.*\$100\.01.*
    direction: UP
- waitForAnimationToEnd
- assertNotVisible: Delete Dinner expense
- assertVisible: .*Dinner.*\$100\.01.*
# The same drag to the right only closes an open card; from a closed card, it is iOS's back
# gesture. It starts well left of the middle, since the gesture needs half the screen's width.
- swipe:
    from:
      text: .*Dinner.*\$100\.01.*
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: Delete Dinner expense
- swipe:
    start: 20%, 38%
    end: 90%, 38%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible: Delete Dinner expense
- assertVisible: Group actions
- swipe:
    start: 20%, 38%
    end: 90%, 38%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible: Group actions
- tapOn: Open Brisbane
- waitForAnimationToEnd
- assertVisible: .*Dinner.*\$100\.01.*
# Swiping the card left on the group's screen shows its Delete, which moves it to
# the trash; Undo puts it back.
- swipe:
    from:
      text: .*Dinner.*\$100\.01.*
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete Dinner expense
- assertVisible: Moved to Trash
- assertVisible: No expenses in this group yet.
- tapOn: Undo deletion of Dinner
- waitForAnimationToEnd
- assertVisible: .*Dinner.*\$100\.01.*
- tapOn: Expenses
- waitForAnimationToEnd
# Taylor was chosen first, so the extra cent is Taylor's: the card shows that share.
- assertVisible: .*Dinner.*\$50\.01.*
- swipe:
    from:
      text: .*Dinner.*\$50\.01.*
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete Dinner expense
- assertVisible: Moved to Trash
- assertNotVisible: .*Dinner.*\$50\.01.*
# On Trash the card shows the full amount and has no Delete: swiping it left opens
# nothing, and a tap opens its read-only details.
- tapOn: Settings
- tapOn: Trash, 1
- waitForAnimationToEnd
- swipe:
    from:
      text: .*Dinner.*\$100\.01.*
    direction: LEFT
- waitForAnimationToEnd
- assertNotVisible: This expense is in the Trash.
- assertNotVisible: Delete.*
- assertVisible: Empty Trash
- tapOn: .*Dinner.*\$100\.01.*
- waitForAnimationToEnd
- assertVisible: This expense is in the Trash.
- tapOn: Restore
- waitForAnimationToEnd
- assertVisible: No deleted expenses.
- tapOn: Back
- waitForAnimationToEnd
# Once the group is archived, its expense's card has no Delete: swiping it left on
# Expenses opens nothing.
- tapOn: Groups
- waitForAnimationToEnd
- tapOn: Back
- waitForAnimationToEnd
- swipe:
    from:
      text: Open Brisbane
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Archive Brisbane
- assertVisible: Group archived · Find it in Settings
- tapOn: Expenses
- waitForAnimationToEnd
- assertVisible: .*Dinner.*Archived.*
- swipe:
    from:
      text: .*Dinner.*Archived.*
    direction: LEFT
- waitForAnimationToEnd
- assertNotVisible: Delete.*
- assertNotVisible: Shared history
- assertVisible: .*Dinner.*Archived.*

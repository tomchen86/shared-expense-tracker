appId: com.tomchen.sharedexpensetracker
name: "[LEDGER-68.2] [GROUPS-64.1] [LEDGER-46.2] [LEDGER-48.2] [LEDGER-49.2] [LEDGER-62.2] [LEDGER-54.1] [GROUPS-61.3] [LEDGER-65.4] Adds a group expense from the group's screen, with a category added over the form, then finds it on the group's screen at its full amount and on Expenses at your share"
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane","members":["Casey"]}]}'
- tapOn: Groups
- tapOn: Open Brisbane
- waitForAnimationToEnd
# The group's screen has a + button of its own, which opens New Expense for the group.
- tapOn: Add expense
- waitForAnimationToEnd
- assertVisible: New Expense
- assertVisible: Group, Brisbane
- tapOn: Amount in .*
- inputText: '100.01'
- tapOn: Expense title
- inputText: Dinner
# Add stays disabled until the payer and the split are chosen, so only the
# category form's Add is enabled while Group Categories is open.
- tapOn: Category, Food & Dining
- waitForAnimationToEnd
- tapOn: \+ Add New Category
- waitForAnimationToEnd
- assertVisible: New Category
- tapOn: Category name
- inputText: Flights
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Category
- assertVisible: New Expense
- assertVisible: Dinner
- assertVisible: Category, Flights
# Where the simulator shows the software keyboard, it covers the rows below Date, and iOS still
# reports them as visible, so scrollUntilVisible would not scroll and the next press would land
# on the keyboard. A press on the form's margin closes it first.
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
# Bring all financial rows into view before opening their pickers. Returning from
# Paid by must still leave Split between directly usable, with no further scroll.
- scrollUntilVisible:
    element: Split between, Choose people
    direction: DOWN
# Choosing the group the form already has closes Select Group and keeps the inputs.
- tapOn: Group, Brisbane
- waitForAnimationToEnd
- tapOn:
    text: Brisbane
    selected: true
- waitForAnimationToEnd
- assertVisible: Group, Brisbane
- assertVisible: Dinner
- assertVisible: Category, Flights
- tapOn: Paid by, not selected
- waitForAnimationToEnd
- tapOn: Casey
- waitForAnimationToEnd
- assertVisible: Paid by, Casey
- assertVisible: Dinner
- tapOn: Split between, Choose people
- waitForAnimationToEnd
- tapOn: Taylor \(You\)
- waitForAnimationToEnd
- tapOn: Casey
- waitForAnimationToEnd
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Split between, 2 people
- assertVisible: Dinner
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Expense
# Back on Brisbane's screen: its card shows the full amount.
- assertVisible: .*Dinner.*\$100\.01.*
- tapOn: Expenses
- waitForAnimationToEnd
# Taylor was chosen first, so the extra cent is Taylor's: the card shows that share.
- assertVisible: .*Dinner.*\$50\.01.*

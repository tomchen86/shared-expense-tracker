appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-51.1] [GROUPS-52.1] [GROUPS-53.2] [GROUPS-54.1] [GROUPS-55.2] [GROUPS-57.1] Opens an archived group from Settings and restores it'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane","archived":true}]}'
- tapOn: Settings
- tapOn: Archived groups, 1
- assertVisible: Restore Brisbane
- tapOn: Open Brisbane
- assertVisible: Archived group. Expenses and allocations are read-only.
- tapOn: Restore Group
- waitForAnimationToEnd
- assertNotVisible: Archived group. Expenses and allocations are read-only.
- assertNotVisible: Restore Group
- tapOn: Back
- assertVisible: No archived groups.
- tapOn: Groups
- assertVisible: Open Brisbane

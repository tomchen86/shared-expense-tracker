appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-91.1] The press that closes the date calendar reaches nothing on the form'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- tapOn: Groups
- tapOn: Add group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- tapOn: Open Brisbane
- tapOn: Group actions
- tapOn: Members
- tapOn: Add Member
- inputText: Casey
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Close
- waitForAnimationToEnd
- tapOn: Add expense
- waitForAnimationToEnd
# While the calendar is open, only its own controls can be found by name, so these
# presses go where Category and Expense title are, above the calendar.
- tapOn: Date Picker
- waitForAnimationToEnd
- assertVisible: Previous Month
- tapOn:
    point: 20%,41%
- waitForAnimationToEnd
- assertNotVisible: Previous Month
- assertNotVisible: Transportation
- tapOn: Category, Food & Dining
- waitForAnimationToEnd
- assertVisible: Transportation
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- tapOn: Date Picker
- waitForAnimationToEnd
- assertVisible: Previous Month
- tapOn:
    point: 50%,25%
- waitForAnimationToEnd
- assertNotVisible: Previous Month
- inputText: Lost
- assertNotVisible: Lost
- tapOn: Expense title
- inputText: Kept
- assertVisible: Kept

appId: com.tomchen.sharedexpensetracker
name: '[SHELL-18.1] [SHELL-17.1] Keeps the name saved with Return after a restart'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible:
    text: Settings
    selected: true
- tapOn: Enter your name
- inputText: Taylor
# On a slow runner, typing can start before the field takes it and garble the name,
# so type it again. Maestro cannot check the name first: on iOS it reads a text
# field's placeholder, not what was typed.
- eraseText: 20
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible: Taylor

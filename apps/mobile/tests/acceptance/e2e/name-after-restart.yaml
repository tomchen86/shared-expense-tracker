appId: com.tomchen.sharedexpensetracker
name: '[SHELL-18.1] [SHELL-17.1] Keeps the name saved with Return after a restart'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible:
    text: Settings
    selected: true
- tapOn: Enter your name
- inputText: Taylor
# On a slow runner, typing can start before the field takes it and garble the name.
- copyTextFrom: Your name
- runFlow:
    when:
      true: ${maestro.copiedText !== 'Taylor'}
    commands:
      - eraseText: 20
      - inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible: Taylor

appId: com.tomchen.sharedexpensetracker
name: '[SHELL-48.2] [SHELL-51.1] [GROUPS-22.3] Shows all three of Group actions with no Cancel, opens Group Categories from them, and on Android closes the dialog with the back button'
tags:
  - android
---
# An Android dialog shows three buttons and drops any others, which Jest cannot see, so this also
# runs there: scripts/e2e-android.sh.
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane"}]}'
- tapOn: Groups
- waitForAnimationToEnd
- tapOn: Open Brisbane.*
- waitForAnimationToEnd
- tapOn: Group actions
- waitForAnimationToEnd
- assertVisible: Members
- assertVisible: Rename Group
- assertVisible: Categories
- assertNotVisible: Cancel
- tapOn: Categories
- waitForAnimationToEnd
- assertVisible: Group Categories
- tapOn: Close
- waitForAnimationToEnd
- assertNotVisible: Group Categories
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Group actions
      - waitForAnimationToEnd
      - assertVisible: Rename Group
      - back
      - waitForAnimationToEnd
      - assertNotVisible: Rename Group
      - assertVisible: Group actions

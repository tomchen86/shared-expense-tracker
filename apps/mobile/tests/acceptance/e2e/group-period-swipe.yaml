appId: com.tomchen.sharedexpensetracker
name: "[LEDGER-114.1] Goes back with a drag to the right from a group's period row on Group Total, and on a month swipes the period's name and the total to the month before and back without leaving the group's screen"
---
# The names of this month and last month, by the simulator's clock.
- evalScript: "${output.months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']}"
- evalScript: '${output.thisMonth = output.months[new Date().getMonth()]}'
- evalScript: '${output.lastMonth = output.months[(new Date().getMonth() + 11) % 12]}'
- evalScript: '${output.thisYear = String(new Date().getFullYear())}'
- evalScript: '${output.lastMonthsYear = String(new Date().getMonth() === 0 ? new Date().getFullYear() - 1 : new Date().getFullYear())}'
# Brisbane's expenses today and on the 15th of last month.
- evalScript: '${output.lastMonth15 = new Date(new Date().getFullYear(), new Date().getMonth() - 1, 15)}'
- evalScript: "${output.lastMonthDate = output.lastMonth15.getFullYear() + '-' + ('0' + (output.lastMonth15.getMonth() + 1)).slice(-2) + '-15'}"
# Maestro reads ${…} up to the last } in the value, so a seed with dates is built in one script.
- evalScript: "${output.seedJson = JSON.stringify({ name: 'Taylor', groups: [{ name: 'Brisbane', members: ['Casey'] }], expenses: [{ title: 'Today', amount: '3.00', group: 'Brisbane' }, { title: 'Last month', amount: '2.00', date: output.lastMonthDate, group: 'Brisbane' }] })}"
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: ${output.seedJson}
- tapOn: Groups
- tapOn: Open Brisbane
- waitForAnimationToEnd
# A group's screen opens on Group Total, which no swipe changes, so the period row keeps no
# drag: one to the right from the period's name is iOS's back gesture, as from a closed card
# (GROUPS-80.1). It starts on the name, left of the middle, since the gesture needs half the
# screen's width: under the large title, the period's name of an iPhone 17 lies across 23% of
# the screen's height.
- assertVisible: Choose period\. Group Total
- assertVisible: Group actions
- swipe:
    start: 40%, 23%
    end: 95%, 23%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible: Group actions
- tapOn: Open Brisbane
- waitForAnimationToEnd
# This Month, from the menu on the period's name.
- tapOn: Choose period\..*
- tapOn: This Month
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
- assertVisible: Today, .*
- assertNotVisible: Last month, .*
# On a month, right on the period's name goes back a month and stays on the group's screen.
- swipe:
    from:
      text: Choose period\..*
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.lastMonth} ${output.lastMonthsYear}
- assertVisible: Last month, .*
- assertNotVisible: Today, .*
- assertVisible: Group actions
# A swipe on the total changes the period too: left comes forward again and right goes back,
# still on the group's screen.
- swipe:
    from:
      text: '${output.lastMonth} ${output.lastMonthsYear}: .*'
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
- assertVisible: Today, .*
- swipe:
    from:
      text: '${output.thisMonth} ${output.thisYear}: .*'
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.lastMonth} ${output.lastMonthsYear}
- assertVisible: Last month, .*
- assertVisible: Group actions

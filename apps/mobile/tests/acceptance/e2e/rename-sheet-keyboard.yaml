appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-76.1] Rename Group and Rename Member save or cancel with one tap while typing'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane","members":["Casey"]}]}'
- tapOn: Groups
- tapOn: Open Brisbane
- waitForAnimationToEnd
- longPressOn: Brisbane
- waitForAnimationToEnd
- assertVisible: Rename Group
- assertVisible: Group name
- assertVisible: Cancel
- assertVisible: Save
- eraseText: 20
- inputText: Tokyo
- takeScreenshot: rename-group-keyboard
- tapOn: Save
- waitForAnimationToEnd
- assertNotVisible: Rename Group
- assertVisible: Tokyo
- longPressOn: Tokyo
- waitForAnimationToEnd
- eraseText: 20
- inputText: Osaka
- tapOn: Cancel
- waitForAnimationToEnd
- assertNotVisible: Rename Group
- assertVisible: Tokyo
- assertNotVisible: Osaka
- tapOn: Group actions
- tapOn: Members
- waitForAnimationToEnd
- tapOn: Casey
- tapOn: Rename
- waitForAnimationToEnd
- assertVisible: Rename Member
- assertVisible: Member name
- assertVisible: Cancel
- assertVisible: Save
- eraseText: 20
- inputText: Casey K.
- takeScreenshot: rename-member-keyboard
- tapOn: Save
- waitForAnimationToEnd
- assertNotVisible: Rename Member
- assertVisible: Casey K\.
- tapOn: Casey K\.
- tapOn: Rename
- waitForAnimationToEnd
- eraseText: 20
- inputText: Casey L.
- tapOn: Cancel
- waitForAnimationToEnd
- assertNotVisible: Rename Member
- assertVisible: Casey K\.
- assertNotVisible: Casey L\.

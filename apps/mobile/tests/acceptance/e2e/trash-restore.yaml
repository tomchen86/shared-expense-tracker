appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-76.1] [LEDGER-77.3] [LEDGER-78.3] [LEDGER-79.3] Opens an expense in Trash from Settings and restores it'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"expenses":[{"title":"Coffee run","amount":"8.75","trashed":true}]}'
- assertNotVisible: Coffee run, .*
- tapOn: Settings
- tapOn: Trash, 1
- tapOn: Coffee run, .*
- assertVisible: This expense is in the Trash.
- tapOn: Restore
- waitForAnimationToEnd
- assertVisible: No deleted expenses.
- tapOn: Expenses
- assertVisible: Coffee run, .*

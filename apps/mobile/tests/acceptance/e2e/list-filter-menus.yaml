appId: com.tomchen.sharedexpensetracker
name: "[LEDGER-134.1] [LEDGER-136.2] [LEDGER-133.2] [LEDGER-131.1] Shows the capsule row once a filter is on, chooses categories and a ledger from the menus of their capsules, the system's on iOS and Material's on Android, which stay open, and a payer on a group's screen"
tags:
  - android
---
# Also runs on the small Android screen of scripts/e2e-android.sh (ADR-0014), where the capsules
# open Material menus (LEDGER-136.2) and the Amount capsule a sheet (LEDGER-150.1) instead of Filters.
# Five expenses of today. Taylor pays Dinner and Casey pays Taxi; both are split with Taylor, so
# the expense list shows all five.
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane","members":["Casey"]}],"expenses":[{"title":"Coffee","amount":"4.00"},{"title":"Shoes","amount":"20.00","category":"Shopping"},{"title":"Train","amount":"30.00","category":"Travel"},{"title":"Dinner","amount":"60.00","group":"Brisbane"},{"title":"Taxi","amount":"25.00","group":"Brisbane","paidBy":"Casey"}]}'
# LEDGER-133.2: no capsule row while no filter is on.
- assertVisible: Filters
- assertNotVisible: Category
- assertNotVisible: Ledger
# LEDGER-131.1: a lowest amount that every expense passes turns a filter on, so the row shows.
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- runFlow: common/done-after-typing.yaml
- waitForAnimationToEnd
- assertVisible: Filters, on
- assertVisible: Category
- assertVisible: Ledger
- assertVisible: Paid by Me
- assertVisible: Amount, 1 or more
- assertVisible: 5 items
# LEDGER-133.2: the Paid by Me capsule turns the condition on and off where it is. Taxi, which
# Casey paid, goes while it is on.
- tapOn: Paid by Me
- waitForAnimationToEnd
- assertVisible:
    text: Paid by Me
    selected: true
- assertVisible: 4 items
- assertNotVisible: Taxi, .*
- tapOn: Paid by Me
- waitForAnimationToEnd
- assertVisible:
    text: Paid by Me
    selected: false
- assertVisible: 5 items
# LEDGER-134.1 and LEDGER-136.2: the Category capsule is a menu of the categories the expenses
# use. It stays open while categories are chosen.
- tapOn: Category
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      # A menu from the capsule, not Filters.
      - assertNotVisible: Done
- assertVisible: Food & Dining
- assertVisible: Shopping
- assertVisible: Travel
- tapOn: Shopping
- waitForAnimationToEnd
- assertVisible:
    text: Shopping
    selected: true
- tapOn: Travel
- waitForAnimationToEnd
- assertVisible:
    text: Travel
    selected: true
- assertVisible: Food & Dining
# A press outside the menu, on the list's margin, closes it.
- runFlow: common/press-outside.yaml
- waitForAnimationToEnd
- assertVisible: Category, 2 Categories
- assertVisible: 2 items
- assertVisible: Train, .*
- assertVisible: Shoes, .*
- assertNotVisible: Coffee, .*
- assertNotVisible: Dinner, .*
# A second press on a chosen category takes it off.
- tapOn: Category, 2 Categories
- waitForAnimationToEnd
- tapOn: Travel
- waitForAnimationToEnd
- runFlow: common/press-outside.yaml
- waitForAnimationToEnd
- assertVisible: Category, Shopping
- assertVisible: 1 item
- assertVisible: Shoes, .*
- assertNotVisible: Train, .*
- tapOn: Category, Shopping
- waitForAnimationToEnd
- tapOn: Shopping
- waitForAnimationToEnd
- runFlow: common/press-outside.yaml
- waitForAnimationToEnd
- assertVisible: Category
- assertVisible: 5 items
# The Ledger capsule lists Personal and the group.
- tapOn: Ledger
- waitForAnimationToEnd
- assertVisible: Personal
- assertVisible: Brisbane
- tapOn: Brisbane
- waitForAnimationToEnd
- assertVisible: Personal
# On Android the back button closes the menu and leaves the list where it is.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: 3%,50%
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
      - waitForAnimationToEnd
      - assertNotVisible: Personal
      - assertVisible: Filters.*
- waitForAnimationToEnd
- assertVisible: Ledger, Brisbane
- assertVisible: 2 items
- assertVisible: Dinner, .*
- assertVisible: Taxi, .*
- assertNotVisible: Coffee, .*
# A group's screen has Paid by in place of Ledger and Paid by Me, and a filter of its own.
# Android reads the group's row as one name, Open Brisbane and what the row says.
- tapOn: Groups
- tapOn: Open Brisbane.*
- waitForAnimationToEnd
- assertVisible: Filters
- assertNotVisible: Paid by
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- runFlow: common/done-after-typing.yaml
- waitForAnimationToEnd
- assertVisible: Category
- assertVisible: Paid by
- assertVisible: Amount, 1 or more
- assertNotVisible: Ledger
- assertNotVisible: Paid by Me
- tapOn: Paid by
- waitForAnimationToEnd
- assertVisible: You
- assertVisible: Casey
- tapOn: Casey
- waitForAnimationToEnd
- runFlow: common/press-outside.yaml
- waitForAnimationToEnd
- assertVisible: Paid by, Casey
- assertVisible: 1 item
- assertVisible: Taxi, .*
- assertNotVisible: Dinner, .*
# The amount goes, in the popover or the sheet of its capsule, so Paid by is the only condition
# that is on.
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- eraseText: 1
- runFlow: common/press-outside.yaml
- waitForAnimationToEnd
- assertVisible: Paid by, Casey
- assertVisible: Amount
# LEDGER-134.1 and LEDGER-136.2: another payer is chosen before the first is taken off, and the
# menu stays open through both presses.
- tapOn: Paid by, Casey
- waitForAnimationToEnd
- tapOn: You
- waitForAnimationToEnd
- assertVisible: Casey
- tapOn: Casey
- waitForAnimationToEnd
- assertVisible: You
- runFlow: common/press-outside.yaml
- waitForAnimationToEnd
- assertVisible: Paid by, You
- assertVisible: Dinner, .*
- assertNotVisible: Taxi, .*
# Taking the last condition off in the menu takes the capsule row away at once, and the menu
# with it: nothing is pressed to close it.
- tapOn: Paid by, You
- waitForAnimationToEnd
- tapOn: You
- waitForAnimationToEnd
- assertNotVisible: Paid by.*
- assertNotVisible: Category
- assertNotVisible: Casey
- assertVisible: Filters
- assertVisible: Taxi, .*
# The small Android screen shows only the first card of a group's screen.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Dinner, .*

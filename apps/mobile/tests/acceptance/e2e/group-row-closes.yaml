appId: com.tomchen.sharedexpensetracker
name: "[GROUPS-78.1] [GROUPS-79.2] Closes an open group's card on a drag to the right, opens one on a slanted drag to the left, both without moving the list, and closes one when the list scrolls"
tags:
  - android
---
# Android's scroll view takes a slanted drag before JavaScript hears of it, so this also runs
# there: scripts/e2e-android.sh. A list that cannot scroll never takes the drag, so it needs seven cards.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- waitForAnimationToEnd
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Groups
- waitForAnimationToEnd
- evalScript: ${output.group = 1}
- repeat:
    times: 7
    commands:
      - tapOn: Add group
      - waitForAnimationToEnd
      - assertVisible: New Group
      - inputText: Group ${output.group}
      - tapOn: Create
      - waitForAnimationToEnd
      - assertNotVisible: New Group
      - evalScript: ${output.group = output.group + 1}
# Starting again, with no form still closing.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Groups
- waitForAnimationToEnd
# Every swipe here starts from this point, which seeing Archive proves is on a card. Left and up,
# far enough that a list moving with the finger would bring another card under the point, and
# short of SHELL-69.1's 60% of the card, which would run the action.
- swipe:
    start: 85%, 50%
    end: 35%, 33%
    duration: 300
- waitForAnimationToEnd
- copyTextFrom:
    text: Archive .*
    enabled: true
- evalScript: ${output.open = maestro.copiedText}
# Level, to the right.
- swipe:
    start: 28%, 50%
    end: 60%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Right and down, about 120 by 80 pt.
- swipe:
    start: 28%, 50%
    end: 58%, 59%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Right and up, as far as left and up above.
- swipe:
    start: 15%, 50%
    end: 90%, 25%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# To the right from the open button itself closes the card without pressing the button.
- swipe:
    start: 76%, 50%
    end: 99%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- assertNotVisible: Group archived.*
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# More up than right is scrolling, which moves the list. These upward drags go far enough that it
# moves a whole card even if it starts a moment late, and slowly: on a busy Android emulator a
# 250 ms drag of 288 dp has moved the list as little as 64 dp, and a 1000 ms one at least 232.
- swipe:
    start: 28%, 55%
    end: 58%, 10%
    duration: 1000
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Archive .*
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Archive .*
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
# Starting again puts the list back at its top, on the Groups tab.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Groups
- waitForAnimationToEnd
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Up from another card.
- swipe:
    start: 30%, 75%
    end: 30%, 30%
    duration: 1000
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Archive .*
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Archive .*
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
# More up than left from a closed card is also scrolling.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Groups
- waitForAnimationToEnd
- swipe:
    start: 70%, 55%
    end: 40%, 10%
    duration: 1000
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Archive .*
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Archive .*
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
# Nothing was archived, and no group opened.
- assertNotVisible: Group archived.*
- assertNotVisible: Group actions

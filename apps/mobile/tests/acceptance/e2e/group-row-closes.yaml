appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-78.1] Closes an open group row on a slanted drag to the right without moving the list, and when the list scrolls'
tags:
  - android
---
# Android's scroll view takes a slanted drag before JavaScript hears of it, so this also runs
# there: scripts/e2e-android.sh. A list that cannot scroll never takes the drag, so it needs seven rows.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- waitForAnimationToEnd
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Groups
- waitForAnimationToEnd
- evalScript: ${output.group = 1}
- repeat:
    times: 7
    commands:
      - tapOn: Add group
      - waitForAnimationToEnd
      - assertVisible: New Group
      - inputText: Group ${output.group}
      - tapOn: Create
      - waitForAnimationToEnd
      - assertNotVisible: New Group
      - evalScript: ${output.group = output.group + 1}
# Every swipe here starts from this point, which seeing Archive proves is on a row.
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- copyTextFrom:
    text: Archive .*
    enabled: true
- evalScript: ${output.open = maestro.copiedText}
# Right and down, about 120 by 80 pt.
- swipe:
    start: 28%, 50%
    end: 58%, 59%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Right and up, far enough that a list moving with the finger would bring another row
# under the point.
- swipe:
    start: 15%, 50%
    end: 90%, 25%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Up from another row scrolls the list.
- swipe:
    start: 30%, 75%
    end: 30%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
# Nothing was archived, and the group did not open.
- assertNotVisible: Group archived.*
- assertNotVisible: Group actions

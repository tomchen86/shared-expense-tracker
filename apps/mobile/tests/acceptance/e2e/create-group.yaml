appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-6.1] [GROUPS-8.1] [GROUPS-13.1] [GROUPS-16.1] Closes New Group when it is swiped down, then creates a group that is still there after a restart'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor"}'
- tapOn: Groups
- tapOn: Add group
- assertVisible: New Group
- waitForAnimationToEnd
# The name field has the focus once New Group opens, so the keyboard types into it.
- inputText: Tokyo
# Dragging the sheet down by its title closes it, whatever its height.
- swipe:
    from:
      text: New Group
    direction: DOWN
- waitForAnimationToEnd
- assertNotVisible: New Group
- assertVisible: No groups yet. Tap + to create a group.
- tapOn: Add group
- assertVisible: New Group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- assertVisible: Open Brisbane
- assertNotVisible: New Group
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Groups
- assertVisible: Open Brisbane

appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-70.2] [LEDGER-71.3] [LEDGER-73.2] [LEDGER-75.3] [LEDGER-76.1] [LEDGER-77.3] [LEDGER-78.3] [LEDGER-79.3] Swipes an expense card left to move it to the trash, undoes it, moves it again, keeps it in the trash after a restart, then restores it from Trash'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Add expense
- assertVisible: New Expense
- tapOn: Expense title
- inputText: Coffee run
- tapOn: Amount in .*
- inputText: '8.75'
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Expense
# Swiping the card to the left shows its Delete button.
- swipe:
    from:
      text: Coffee run, .*
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete Coffee run expense
- assertVisible: Moved to Trash
- assertNotVisible: Coffee run, .*
- tapOn: Undo deletion of Coffee run
- waitForAnimationToEnd
- assertVisible: Coffee run, .*
- swipe:
    from:
      text: Coffee run, .*
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete Coffee run expense
- assertVisible: Moved to Trash
# The notice goes after 5 seconds.
- extendedWaitUntil:
    notVisible: Moved to Trash
    timeout: 10000
# The trash is in expo-sqlite, so the expense is still there after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible: Coffee run, .*
- tapOn: Settings
- tapOn: Trash, 1
- tapOn: Coffee run, .*
- assertVisible: This expense is in the Trash.
- tapOn: Restore
- waitForAnimationToEnd
- assertVisible: No deleted expenses.
- tapOn: Expenses
- assertVisible: Coffee run, .*

appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-70.2] [LEDGER-71.3] [LEDGER-73.2] [LEDGER-75.3] Swipes an expense card left to move it to the trash, undoes it, moves it again, and keeps it in the trash after a restart'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"expenses":[{"title":"Coffee run","amount":"8.75"}]}'
# Swiping the card to the left shows its Delete button.
- swipe:
    from:
      text: Coffee run, .*
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete Coffee run expense
# Undo right away: the notice goes after 5 seconds, which two checks can use up on a slow runner.
# The second deletion below checks the notice and the card leaving.
- tapOn: Undo deletion of Coffee run
- waitForAnimationToEnd
- assertVisible: Coffee run, .*
- swipe:
    from:
      text: Coffee run, .*
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete Coffee run expense
- assertVisible: Moved to Trash
- assertNotVisible: Coffee run, .*
# The notice goes after 5 seconds.
- extendedWaitUntil:
    notVisible: Moved to Trash
    timeout: 10000
# The trash is in expo-sqlite, so the expense is still there after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible: Coffee run, .*
- tapOn: Settings
- assertVisible: Trash, 1

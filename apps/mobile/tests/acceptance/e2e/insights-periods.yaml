appId: com.tomchen.sharedexpensetracker
name: '[INSIGHTS-30.1] [INSIGHTS-33.2] [INSIGHTS-36.2] [INSIGHTS-37.1] Moves between periods on Insights by swiping the period name, in the Period sheet, in the year menu, and with Month and Year'
---
# The names of this month, last month and the years around them, by the simulator's clock.
- evalScript: "${output.months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']}"
- evalScript: '${output.thisMonth = output.months[new Date().getMonth()]}'
- evalScript: '${output.lastMonth = output.months[(new Date().getMonth() + 11) % 12]}'
- evalScript: '${output.thisYear = String(new Date().getFullYear())}'
- evalScript: '${output.lastYear = String(new Date().getFullYear() - 1)}'
- evalScript: '${output.lastMonthsYear = String(new Date().getMonth() === 0 ? new Date().getFullYear() - 1 : new Date().getFullYear())}'
# Expenses today, on the 15th of last month, and on the 15th of this month last year.
- evalScript: '${output.lastMonth15 = new Date(new Date().getFullYear(), new Date().getMonth() - 1, 15)}'
- evalScript: "${output.lastMonthDate = output.lastMonth15.getFullYear() + '-' + ('0' + (output.lastMonth15.getMonth() + 1)).slice(-2) + '-15'}"
- evalScript: "${output.lastYearDate = (new Date().getFullYear() - 1) + '-' + ('0' + (new Date().getMonth() + 1)).slice(-2) + '-15'}"
# Maestro reads ${…} up to the last } in the value, so a seed with dates is built in one script.
- evalScript: "${output.seedJson = JSON.stringify({ expenses: [{ title: 'Today', amount: '3.00' }, { title: 'Last month', amount: '2.00', date: output.lastMonthDate }, { title: 'Last year', amount: '1.00', date: output.lastYearDate }] })}"
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: ${output.seedJson}
- tapOn: View expense insights\..*
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
- assertVisible:
    text: Next period
    enabled: false
# INSIGHTS-33.2: right on the period name goes back a month, left comes forward again,
# and left on the latest month does nothing.
- swipe:
    from:
      text: Choose period\..*
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.lastMonth} ${output.lastMonthsYear}
- assertVisible:
    text: Next period
    enabled: true
- swipe:
    from:
      text: Choose period\..*
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
- swipe:
    from:
      text: Choose period\..*
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
- assertVisible:
    text: Next period
    enabled: false
# INSIGHTS-33.2: a swipe on the content changes the period too, and an upward one does not.
- swipe:
    from:
      text: Total spent.*
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.lastMonth} ${output.lastMonthsYear}
- swipe:
    from:
      text: Total spent.*
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
- swipe:
    from:
      text: Total spent.*
    direction: UP
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
# INSIGHTS-36.2: in the Period sheet, last year in Year keeps the month, and Done selects it.
- tapOn: Choose period\..*
- assertVisible: Period
- assertVisible: Cancel
- assertVisible: Done
- tapOn: ${output.thisYear}
- tapOn: ${output.lastYear}
- assertVisible: ${output.thisMonth}
- tapOn: Done
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.lastYear}
# Cancel leaves the selected period as it was.
- tapOn: Choose period\..*
- tapOn: ${output.lastYear}
- tapOn: ${output.thisYear}
- tapOn: Cancel
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.lastYear}
# INSIGHTS-30.1: Year selects the year of the selected month.
- tapOn: Year
- waitForAnimationToEnd
- assertVisible:
    text: Previous period
    enabled: false
# INSIGHTS-37.1: with two years, the period name is a menu of them; this year selects it.
- tapOn: ${output.lastYear}
- tapOn: ${output.thisYear}
- waitForAnimationToEnd
- assertVisible:
    text: Next period
    enabled: false
- assertVisible:
    text: Previous period
    enabled: true
# INSIGHTS-30.1: Month selects the latest month of that year.
- tapOn: Month
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.thisYear}
# INSIGHTS-36.2: in the Period sheet, the Month menu lists the months of the selected
# period's year; choosing this month there and Done selects it.
- swipe:
    from:
      text: Choose period\..*
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.lastMonth} ${output.lastMonthsYear}
- tapOn: Choose period\..*
- assertVisible: Period
- tapOn: ${output.lastMonth}
- tapOn: ${output.thisMonth}
- tapOn: Done
- waitForAnimationToEnd
- assertVisible: Choose period\. ${output.thisMonth} ${output.lastMonthsYear}

appId: com.tomchen.sharedexpensetracker
name: '[CATEGORIES-32.3] Swipes a category left to remove it, finds nothing to swipe on Uncategorized, then swipes an archived category that no expense uses left to delete it'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
# An expense in Travel, so that removing Travel asks to archive it.
- tapOn: Add expense
- assertVisible: New Expense
- tapOn: Expense title
- inputText: Train
- tapOn: Amount in .*
- inputText: '3'
- tapOn: Category, Food & Dining
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Travel
    direction: DOWN
- tapOn: Travel
- waitForAnimationToEnd
- assertVisible: Category, Travel
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Expense
- tapOn: Settings
- tapOn: Manage Categories
- assertVisible: CATEGORIES
- waitForAnimationToEnd
- swipe:
    from:
      text: Other
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Remove
- assertVisible: Delete Category\?
# Pressing the revealed button closes the row.
- assertNotVisible: Remove
- tapOn: Delete
- waitForAnimationToEnd
- assertNotVisible: Other
- swipe:
    from:
      text: Uncategorized
    direction: LEFT
- waitForAnimationToEnd
- assertNotVisible: Remove
- swipe:
    from:
      text: Travel
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Remove
- assertVisible: Archive “Travel”\?
- tapOn: Move Expenses…
- assertVisible: Move Travel Expenses
- tapOn: Health
- waitForAnimationToEnd
- assertVisible: ARCHIVED
# Travel is archived and no expense uses it any more, so it can be deleted.
- swipe:
    from:
      text: Restore Travel
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Delete
- assertVisible: Delete Category\?
- tapOn: Delete
- waitForAnimationToEnd
- assertNotVisible: ARCHIVED
- assertNotVisible: Restore Travel

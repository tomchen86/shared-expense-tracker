appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-86.2] [LEDGER-100.1] Choosing Paid by or closing its list leaves Split between immediately usable in New and Edit Expense'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
# On a slow runner, typing can start before the field takes it and garble the name.
- copyTextFrom: Your name
- runFlow:
    when:
      true: ${maestro.copiedText !== 'Taylor'}
    commands:
      - eraseText: 20
      - inputText: Taylor
- pressKey: Enter
- tapOn: Groups
- tapOn: Add group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- tapOn: Open Brisbane
- tapOn: Group actions
- tapOn: Members
- tapOn: Add Member
- inputText: Casey
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Close
- waitForAnimationToEnd
- tapOn: Add expense
- waitForAnimationToEnd
- tapOn: Amount in .*
- inputText: '12'
- tapOn: Expense title
- inputText: Dinner
- scrollUntilVisible:
    element: Expense note.*
    direction: DOWN
    centerElement: true
    # Rows near the end of the form never reach the center, so Maestro swipes
    # a few more times first, which can outlast the default 20 s.
    timeout: 60000
- tapOn: Expense note.*
- inputText: Dinner note
- scrollUntilVisible:
    element: Split between, Choose people
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: Paid by, not selected
- takeScreenshot: expense-before-payer
- tapOn: Paid by, not selected
- waitForAnimationToEnd
- tapOn: Casey
- waitForAnimationToEnd
- takeScreenshot: expense-after-payer
# Deliberately no scroll or expansion between returning and opening the next row.
- assertVisible: Paid by, Casey
- assertVisible: Split between, Choose people
- tapOn: Split between, Choose people
- waitForAnimationToEnd
- tapOn: Taylor \(You\)
- waitForAnimationToEnd
- tapOn: Casey
- waitForAnimationToEnd
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Split between, 2 people
- tapOn:
    text: Add
    enabled: true
- waitForAnimationToEnd
- assertNotVisible: New Expense
- tapOn: .*Dinner.*
- tapOn: Edit
- waitForAnimationToEnd
- assertVisible: Edit Expense
- scrollUntilVisible:
    element: Split between, 2 people
    direction: DOWN
    centerElement: true
    timeout: 60000
# A disabled row opens no menu when it is pressed.
- assertVisible:
    text: Group, Brisbane
    enabled: false
- tapOn: Group, Brisbane
- waitForAnimationToEnd
- assertNotVisible:
    text: Brisbane
    selected: true
- assertVisible: Paid by, Casey
- tapOn: Paid by, Casey
- waitForAnimationToEnd
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Paid by, Casey
- assertVisible: Split between, 2 people
- tapOn: Split between, 2 people
- assertVisible:
    text: Taylor \(You\)
    selected: true
- assertVisible:
    text: Casey
    selected: true
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Expense note.*
    direction: UP
- assertVisible: .*Dinner note.*
- scrollUntilVisible:
    element: Expense title
    direction: UP
- assertVisible: Dinner
- assertVisible: 12(\.00)?

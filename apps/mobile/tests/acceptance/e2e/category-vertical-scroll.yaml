appId: com.tomchen.sharedexpensetracker
name: '[CATEGORIES-47.1] Vertical drags scroll long personal and group category lists without editing or restoring'
---
# Repeat the same visible behavior on the Settings page and the group sheet.
- evalScript: ${output.scope = 'personal'}
- repeat:
    times: 2
    commands:
      # Travel archived after its expense moved to Health, as Remove and Move Expenses… leave it,
      # and twelve rows more than the default nine, which do not overflow.
      - runFlow:
          when:
            true: ${output.scope === 'personal'}
          file: common/launch-with-seed.yaml
          env:
            SEED: '{"name":"Taylor","categories":[{"name":"Travel","archived":true},{"name":"Scroll 1"},{"name":"Scroll 2"},{"name":"Scroll 3"},{"name":"Scroll 4"},{"name":"Scroll 5"},{"name":"Scroll 6"},{"name":"Scroll 7"},{"name":"Scroll 8"},{"name":"Scroll 9"},{"name":"Scroll 10"},{"name":"Scroll 11"},{"name":"Scroll 12"}],"expenses":[{"title":"Train","amount":"3","category":"Health"}]}'
      - runFlow:
          when:
            true: ${output.scope === 'group'}
          file: common/launch-with-seed.yaml
          env:
            SEED: '{"name":"Taylor","groups":[{"name":"Brisbane"}],"categories":[{"name":"Travel","group":"Brisbane","archived":true},{"name":"Scroll 1","group":"Brisbane"},{"name":"Scroll 2","group":"Brisbane"},{"name":"Scroll 3","group":"Brisbane"},{"name":"Scroll 4","group":"Brisbane"},{"name":"Scroll 5","group":"Brisbane"},{"name":"Scroll 6","group":"Brisbane"},{"name":"Scroll 7","group":"Brisbane"},{"name":"Scroll 8","group":"Brisbane"},{"name":"Scroll 9","group":"Brisbane"},{"name":"Scroll 10","group":"Brisbane"},{"name":"Scroll 11","group":"Brisbane"},{"name":"Scroll 12","group":"Brisbane"}],"expenses":[{"title":"Train","amount":"3","group":"Brisbane","category":"Health","splitBetween":["Taylor"]}]}'
      - evalScript: "${output.rows = ['Food & Dining', 'Transportation', 'Shopping', 'Entertainment', 'Bills & Utilities', 'Health', 'Other', 'Uncategorized', 'Scroll 1', 'Scroll 2', 'Scroll 3', 'Scroll 4', 'Scroll 5', 'Scroll 6', 'Scroll 7', 'Scroll 8', 'Scroll 9', 'Scroll 10', 'Scroll 11', 'Scroll 12']}"
      - runFlow:
          when:
            true: ${output.scope === 'personal'}
          commands:
            - tapOn: Settings
            - tapOn: Manage Categories
      - runFlow:
          when:
            true: ${output.scope === 'group'}
          commands:
            - tapOn: Groups
            - tapOn: Open Brisbane
            - waitForAnimationToEnd
            - tapOn: Group actions
            - waitForAnimationToEnd
            - tapOn: Categories
            - waitForAnimationToEnd
            - assertVisible: Group Categories
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element: Food & Dining
          direction: UP
      - assertVisible: Shopping
      # iOS keeps some offscreen AX nodes. Compare a row with the fixed bar
      # before/after the gesture instead of trusting assertVisible alone.
      - assertVisible:
          text: Food & Dining
          below: Add category
      - takeScreenshot: category-${output.scope}-before-up
      # This gesture must make a previously offscreen row visible.
      - swipe:
          from:
            text: Shopping
          direction: UP
      - waitForAnimationToEnd
      - assertNotVisible:
          text: Food & Dining
          below: Add category
      - assertNotVisible: Remove
      - assertNotVisible: Delete
      - assertNotVisible: Edit Category
      - takeScreenshot: category-${output.scope}-after-up
      # No intervening scroll: the newly revealed row must really be tappable.
      - tapOn: Scroll 6
      - waitForAnimationToEnd
      - assertVisible: Edit Category
      - copyTextFrom: Category name
      - assertTrue: ${maestro.copiedText === 'Scroll 6'}
      - tapOn: Cancel
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element: Restore Travel
          direction: DOWN
          # Leave room to the driver's 90%-of-screen DOWN endpoint before
          # measuring the row that the tested gesture must bring into view.
          centerElement: true
          # At the end of the list the row never reaches the center, so Maestro
          # swipes a few more times first, which can outlast the default 20 s.
          timeout: 60000
      - assertVisible: ARCHIVED
      - assertVisible: Restore Travel
      # Pick the row immediately before the first one below the fixed bar.
      # This adapts to the page/sheet viewport without using private view IDs.
      - copyTextFrom:
          text: ${output.rows.join('|')}
          below: Add category
          index: 0
      - evalScript: ${output.firstRow = output.rows.indexOf(maestro.copiedText)}
      - assertTrue: ${output.firstRow > 0}
      - evalScript: ${output.aboveHeader = output.rows[output.firstRow - 1]}
      - assertNotVisible:
          text: ${output.aboveHeader}
          below: Add category
      - takeScreenshot: category-${output.scope}-before-down
      # Travel can expose Delete and can be restored by a tap, so this checks
      # both accidental actions while proving that the list actually moves.
      - swipe:
          from:
            text: Restore Travel
          direction: DOWN
          duration: 200
      - waitForAnimationToEnd
      # In the full-height group sheet Travel ends up near the bottom of the screen,
      # with too little room to drag past one row, so a row higher up finishes the job.
      - runFlow:
          when:
            true: ${output.scope === 'group'}
          commands:
            - assertVisible: Restore Travel
            - swipe:
                from:
                  text: Scroll 8
                direction: DOWN
                duration: 200
            - waitForAnimationToEnd
      - assertVisible:
          text: ${output.aboveHeader}
          below: Add category
      - assertNotVisible: Remove
      - assertNotVisible: Delete
      - assertNotVisible: Edit Category
      - takeScreenshot: category-${output.scope}-after-down
      - scrollUntilVisible:
          element: Restore Travel
          direction: DOWN
      - assertVisible: ARCHIVED
      - assertVisible: Restore Travel
      - scrollUntilVisible:
          element: Food & Dining
          direction: UP
      - assertNotVisible: Travel
      - assertVisible: Shopping
      - evalScript: ${output.scope = 'group'}

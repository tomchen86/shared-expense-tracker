appId: com.tomchen.sharedexpensetracker
name: "[SHARING-71.2] [SHARING-72.1] [SHARING-123.1] Opens Join Group from a link on the app's own scheme, while the app runs and when the link starts it, with what follows the # taken in, until Close"
tags:
  - android
---
# The system hands a link to the app through native code, which Jest replaces: only a build shows
# whether the part after the # comes through. Each platform does it its own way, so this also runs
# on Android: scripts/e2e-android.sh. The build for the flows names no API, so a link whose secret
# came through gets as far as needing the network, and one without a secret is refused at once.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible:
    text: Settings
    selected: true
# While the app runs. iOS asks before it opens a link on an app's own scheme.
- openLink: shared-expense-tracker://i/3q2-7wEjRWeJq83vEjRWeA#AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
- runFlow:
    when:
      platform: iOS
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Join Group
    timeout: 15000
- assertVisible: Connect to the internet to join this group.
- assertVisible: Try Again
- tapOn: Close
- waitForAnimationToEnd
- assertNotVisible: Join Group
- assertVisible:
    text: Settings
    selected: true
# The same link without its secret.
- openLink: shared-expense-tracker://i/3q2-7wEjRWeJq83vEjRWeA
- runFlow:
    when:
      platform: iOS
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Join Group
    timeout: 15000
- assertVisible: This invite link can't be used. Ask the person who sent it to send it again.
- tapOn: Close
- waitForAnimationToEnd
- assertNotVisible: Join Group
# When the link starts the app.
- stopApp
- openLink: shared-expense-tracker://i/ASNFZ4mrze_-3LqYdlQyEA#ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8
- runFlow:
    when:
      platform: iOS
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Join Group
    timeout: 30000
- assertVisible: Connect to the internet to join this group.
- tapOn: Close
- waitForAnimationToEnd
- assertNotVisible: Join Group
- assertVisible:
    text: Expenses
    selected: true

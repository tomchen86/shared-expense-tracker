appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-88.1] Closes an open card on a slanted drag to the right without moving the list, and when the list scrolls'
tags:
  - android
---
# Android's scroll view takes a slanted drag before JavaScript hears of it, so this also runs
# there: scripts/e2e-android.sh. A list that cannot scroll never takes the drag, so it needs six cards.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- evalScript: ${output.card = 1}
- repeat:
    times: 6
    commands:
      - tapOn: Add expense
      - assertVisible: New Expense
      - tapOn: Expense title
      - inputText: Card ${output.card}
      - tapOn: Amount in .*
      - inputText: '1'
      - tapOn:
          text: Add
          enabled: true
      - waitForAnimationToEnd
      - assertNotVisible: New Expense
      - evalScript: ${output.card = output.card + 1}
# Every swipe here starts from this point, which seeing Delete proves is on a card.
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- evalScript: ${output.open = maestro.copiedText}
# Right and down, about 120 by 80 pt.
- swipe:
    start: 28%, 50%
    end: 58%, 59%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Right and up, far enough that a list moving with the finger would bring another card
# under the point.
- swipe:
    start: 15%, 50%
    end: 90%, 25%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Nearly level.
- swipe:
    start: 28%, 50%
    end: 58%, 53%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Level.
- swipe:
    start: 28%, 50%
    end: 60%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Up from the open card itself scrolls the list.
- swipe:
    start: 28%, 50%
    end: 28%, 25%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
# Starting again puts the list back at its top.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: Delete .* expense
    enabled: true
# Up from another card scrolls the list.
- swipe:
    start: 30%, 75%
    end: 30%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
# Nothing was deleted, and no details opened.
- assertNotVisible: Moved to Trash
- assertNotVisible: Edit

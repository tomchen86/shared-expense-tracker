appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-88.1] [LEDGER-89.1] Closes an open card on a drag to the right, opens one on a slanted drag to the left, both without moving the list, and closes one when the list scrolls'
tags:
  - android
---
# Android's scroll view takes a slanted drag before JavaScript hears of it, so this also runs
# there: scripts/e2e-android.sh. A list that cannot scroll never takes the drag, so it needs eight cards,
# which also let it move a whole card under any point.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- evalScript: ${output.card = 1}
- repeat:
    times: 8
    commands:
      - tapOn: Add expense
      - assertVisible: New Expense
      - tapOn: Expense title
      - inputText: Card ${output.card}
      - tapOn: Amount in .*
      - inputText: '1'
      - tapOn:
          text: Add
          enabled: true
      - waitForAnimationToEnd
      - assertNotVisible: New Expense
      - evalScript: ${output.card = output.card + 1}
# Starting again, with no form still closing.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
# Every swipe here starts from this point, which seeing Delete proves is on a card. Left and up,
# far enough that a list moving with the finger would bring another card under the point.
- swipe:
    start: 85%, 50%
    end: 15%, 30%
    duration: 300
- waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- evalScript: ${output.open = maestro.copiedText}
# Level, to the right.
- swipe:
    start: 28%, 50%
    end: 60%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Right and down, about 120 by 80 pt.
- swipe:
    start: 28%, 50%
    end: 58%, 59%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Right and up, as far as left and up above.
- swipe:
    start: 15%, 50%
    end: 90%, 25%
    duration: 300
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Nearly level.
- swipe:
    start: 28%, 50%
    end: 58%, 53%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# A short, slow drag springs back.
- swipe:
    start: 28%, 50%
    end: 33%, 50%
    duration: 1000
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# To the right from the open button itself closes the card without pressing the button. On
# Android the button sometimes keeps the touch, which leaves the card open, still unpressed.
- swipe:
    start: 76%, 50%
    end: 99%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible: Moved to Trash
- runFlow:
    when:
      platform: iOS
    commands:
      - assertNotVisible:
          text: Delete .* expense
          enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# More up than right is scrolling, which moves the list. These upward drags go far enough that it
# moves a whole card even if it starts a moment late.
- swipe:
    start: 28%, 55%
    end: 58%, 10%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Delete .* expense
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
# Starting again puts the list back at its top.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Straight up from the open card.
- swipe:
    start: 28%, 55%
    end: 28%, 10%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Delete .* expense
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    text: ${output.open}
    enabled: true
# Up from another card.
- swipe:
    start: 30%, 75%
    end: 30%, 30%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Delete .* expense
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
# More up than left from a closed card is also scrolling.
- launchApp
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- swipe:
    start: 70%, 55%
    end: 40%, 10%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
- swipe:
    start: 70%, 50%
    end: 20%, 50%
    duration: 300
- waitForAnimationToEnd
# The list moved, so the point can now fall between two cards.
- runFlow:
    when:
      notVisible:
        text: Delete .* expense
        enabled: true
    commands:
      - swipe:
          start: 70%, 56%
          end: 20%, 56%
          duration: 300
      - waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- assertTrue: ${maestro.copiedText !== output.open}
# Nothing was deleted, and no details opened.
- assertNotVisible: Moved to Trash
- assertNotVisible: Edit

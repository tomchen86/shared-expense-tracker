appId: com.tomchen.sharedexpensetracker
name: "[LEDGER-135.1] [LEDGER-150.1] [LEDGER-133.2] [LEDGER-138.1] [LEDGER-114.2] Opens the small window of the Amount capsule, a popover on iOS and a sheet on Android, types the lowest and the highest amount there, sees the list follow, swipes the words of a filter that leaves nothing to last month and back, clears it, and closes the sheet with Android's back button"
tags:
  - android
---
# Also runs on the small Android screen of scripts/e2e-android.sh (ADR-0014), where the Amount
# capsule opens a sheet from the bottom (LEDGER-150.1) instead of Filters.
# Small and Large of today, 3.00 and 9.00, and Brisbane's Dinner and Taxi, 60.00 and 25.00, of
# which your shares on the expense list are 30.00 and 12.50.
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane","members":["Casey"]}],"expenses":[{"title":"Small","amount":"3.00"},{"title":"Large","amount":"9.00"},{"title":"Dinner","amount":"60.00","group":"Brisbane"},{"title":"Taxi","amount":"25.00","group":"Brisbane"}]}'
# A lowest amount that every expense passes turns a filter on, so the capsule row shows.
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- runFlow: common/done-after-typing.yaml
- waitForAnimationToEnd
- assertVisible: Amount, 1 or more
- assertVisible: 4 items
# LEDGER-135.1 and LEDGER-150.1: a press on the Amount capsule opens a popover or a sheet with the
# two fields, the caret after the 1 in the lowest amount.
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      # A sheet with the two fields, not Filters.
      - assertNotVisible: Done
      - assertNotVisible: Category, .*
- assertVisible: Lowest amount
- assertVisible: Highest amount
- takeScreenshot: amount-popover
# With the 1 erased no condition is on: the popover or the sheet and the row stay, so a new amount
# can be typed.
- eraseText: 1
- assertVisible: Lowest amount
- inputText: '5'
# The popover or the sheet stays open while its fields change.
- assertVisible: Lowest amount
- assertVisible: Highest amount
# A press outside it closes it and the keyboard.
- runFlow: common/close-amount.yaml
- waitForAnimationToEnd
- assertNotVisible: Highest amount
- assertVisible: Amount, 5 or more
- assertVisible: 3 items
- assertVisible: Taxi, .*
- assertVisible: Dinner, .*
# The small Android screen shows the first two cards under the capsule row.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Large, .*
- assertNotVisible: Small, .*
# The highest amount is typed in the second field.
- tapOn: Amount, 5 or more
- waitForAnimationToEnd
- tapOn: Highest amount
- inputText: '10'
- runFlow: common/close-amount.yaml
- waitForAnimationToEnd
- assertVisible: Amount, 5 – 10
- assertVisible: 1 item
- assertVisible: Large, .*
- assertNotVisible: Taxi, .*
# A range that no expense is in: the list says so, and Clear Filters takes the filter off.
- tapOn: Amount, 5 – 10
- waitForAnimationToEnd
- eraseText: 1
- inputText: '100'
- runFlow: common/close-amount.yaml
- waitForAnimationToEnd
- assertVisible: Amount, 100 – 10
- assertVisible: No Matching Expenses
- assertVisible: Your expenses are still here\. No expense matches the filters that are on\.
- assertNotVisible: Large, .*
- assertNotVisible: Sort By, .*
# LEDGER-114.2: these words take a sideways swipe as the words of a period with no expense do.
# Right goes to last month, where Next period can be pressed and the filter still leaves
# nothing; left comes back to this month, where Next period is disabled.
- swipe:
    from:
      text: No Matching Expenses
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: No Matching Expenses
- assertVisible: Amount, 100 – 10
- assertVisible:
    text: Next period
    enabled: true
- swipe:
    from:
      text: No Matching Expenses
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: No Matching Expenses
- assertVisible:
    text: Next period
    enabled: false
- tapOn: Clear Filters
- waitForAnimationToEnd
- assertNotVisible: No Matching Expenses
- assertNotVisible: Amount
- assertVisible: Filters
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Small, .*
      - assertVisible: Large, .*
- runFlow:
    when:
      platform: Android
    commands:
      # The newest two, which the small screen shows.
      - assertVisible: Taxi, .*
      - assertVisible: Dinner, .*
# A popover or a sheet that closes with its fields empty and no other condition on takes the row
# with it.
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- runFlow: common/done-after-typing.yaml
- waitForAnimationToEnd
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- eraseText: 1
- assertVisible: Lowest amount
- runFlow: common/close-amount.yaml
- waitForAnimationToEnd
- assertNotVisible: Lowest amount
- assertNotVisible: Amount.*
- assertVisible: Filters
- assertVisible: 'Sort By, Newest First'
# A group's screen compares the whole amount of each expense.
# Android reads the group's row as one name, Open Brisbane and what the row says.
- tapOn: Groups
- tapOn: Open Brisbane.*
- waitForAnimationToEnd
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- runFlow: common/done-after-typing.yaml
- waitForAnimationToEnd
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- eraseText: 1
- inputText: '30'
- runFlow: common/close-amount.yaml
- waitForAnimationToEnd
- assertVisible: Amount, 30 or more
- assertVisible: 1 item
- assertVisible: Dinner, .*
- assertNotVisible: Taxi, .*
# LEDGER-150.1: on Android the back button first closes the keyboard, then the sheet.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Amount, 30 or more
      - waitForAnimationToEnd
      - pressKey: back
      - waitForAnimationToEnd
      - assertVisible: Highest amount
      - pressKey: back
      - waitForAnimationToEnd
      - assertNotVisible: Highest amount
      - assertVisible: Amount, 30 or more
      - assertVisible: Dinner, .*

appId: com.tomchen.sharedexpensetracker
name: '[LEDGER-135.1] [LEDGER-133.1] [LEDGER-138.1] Opens the popover of the Amount capsule, types the lowest and the highest amount there, sees the list follow, and clears a filter that leaves nothing'
---
# Small and Large of today, 3.00 and 9.00, and Brisbane's Dinner and Taxi, 60.00 and 25.00, of
# which your shares on the expense list are 30.00 and 12.50.
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane","members":["Casey"]}],"expenses":[{"title":"Small","amount":"3.00"},{"title":"Large","amount":"9.00"},{"title":"Dinner","amount":"60.00","group":"Brisbane"},{"title":"Taxi","amount":"25.00","group":"Brisbane"}]}'
# A lowest amount that every expense passes turns a filter on, so the capsule row shows.
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- tapOn: Done
- waitForAnimationToEnd
- assertVisible: Amount, 1 or more
- assertVisible: 4 items
# LEDGER-135.1: a press on the Amount capsule opens a popover with the two fields, the caret in
# the lowest amount, which holds the 1.
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- assertVisible: Lowest amount
- assertVisible: Highest amount
- takeScreenshot: amount-popover
# With the 1 erased no condition is on: the popover and the row stay, so a new amount can be typed.
- eraseText: 1
- assertVisible: Lowest amount
- inputText: '5'
# The popover stays open while its fields change.
- assertVisible: Lowest amount
- assertVisible: Highest amount
# A press outside it, on the list's margin, closes it and the keyboard.
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertNotVisible: Highest amount
- assertVisible: Amount, 5 or more
- assertVisible: 3 items
- assertVisible: Large, .*
- assertVisible: Dinner, .*
- assertVisible: Taxi, .*
- assertNotVisible: Small, .*
# The highest amount is typed in the second field.
- tapOn: Amount, 5 or more
- waitForAnimationToEnd
- tapOn: Highest amount
- inputText: '10'
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Amount, 5 – 10
- assertVisible: 1 item
- assertVisible: Large, .*
- assertNotVisible: Taxi, .*
# A range that no expense is in: the list says so, and Clear Filters takes the filter off.
- tapOn: Amount, 5 – 10
- waitForAnimationToEnd
- eraseText: 1
- inputText: '100'
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Amount, 100 – 10
- assertVisible: No Matching Expenses
- assertVisible: Your expenses are still here\. No expense matches the filters that are on\.
- assertNotVisible: Large, .*
- assertNotVisible: Sort By, .*
- tapOn: Clear Filters
- waitForAnimationToEnd
- assertNotVisible: No Matching Expenses
- assertNotVisible: Amount
- assertVisible: Filters
- assertVisible: Small, .*
- assertVisible: Large, .*
# A popover that closes with its fields empty and no other condition on takes the row with it.
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- tapOn: Done
- waitForAnimationToEnd
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- eraseText: 1
- assertVisible: Lowest amount
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertNotVisible: Lowest amount
- assertNotVisible: Amount.*
- assertVisible: Filters
- assertVisible: 'Sort By, Newest First'
# A group's screen compares the whole amount of each expense.
- tapOn: Groups
- tapOn: Open Brisbane
- waitForAnimationToEnd
- tapOn: Filters
- waitForAnimationToEnd
- tapOn: Lowest amount
- inputText: '1'
- tapOn: Done
- waitForAnimationToEnd
- tapOn: Amount, 1 or more
- waitForAnimationToEnd
- eraseText: 1
- inputText: '30'
- tapOn:
    point: 3%,50%
- waitForAnimationToEnd
- assertVisible: Amount, 30 or more
- assertVisible: 1 item
- assertVisible: Dinner, .*
- assertNotVisible: Taxi, .*

appId: com.tomchen.sharedexpensetracker
name: '[SHELL-24.1] Opens a Settings row with one tap while the keyboard is open'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- assertVisible:
    text: Settings
    selected: true
- tapOn: Enter your name
- inputText: Taylor
# On a slow runner, typing can start before the field takes it and garble the name,
# so type it again. Maestro cannot check the name first: on iOS it reads a text
# field's placeholder, not what was typed.
- eraseText: 20
- inputText: Taylor
# The row's accessible name goes on with the number of archived groups (GROUPS-51.1).
- tapOn: Archived Groups.*
- assertVisible: Back
- assertNotVisible: Manage Categories

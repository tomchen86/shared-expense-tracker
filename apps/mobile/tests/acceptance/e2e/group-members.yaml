appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-20.2] [GROUPS-22.2] [GROUPS-23.1] [GROUPS-24.2] [GROUPS-25.2] [GROUPS-26.1] [GROUPS-29.2] [GROUPS-30.2] [GROUPS-31.2] [GROUPS-34.2] [GROUPS-40.2] [GROUPS-41.1] Opens Members from the Group actions menu, adds two members in its name field, removes one from their action sheet, adds them back, swipes Members down, then renames the group from its title'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Groups
- tapOn: Add group
- assertVisible: New Group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- tapOn: Open Brisbane
- assertVisible: No expenses in this group yet.
# The native menu opens from its button, which is named after the menu.
- tapOn: Group actions
- tapOn: Members
- waitForAnimationToEnd
- assertVisible: Taylor (You)
- tapOn: Add Member
- waitForAnimationToEnd
# The name field in Members has the focus, so the keyboard types into it.
- inputText: Blake
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: Blake
# The field is empty and keeps the focus, so the next name goes straight in.
- inputText: Casey
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: Casey
# Return on the empty field closes it and Add Member comes back.
- pressKey: Enter
- waitForAnimationToEnd
- assertNotVisible: Member name
- tapOn: Blake
- assertVisible: If removed, their historical payments and shares will be retained.
- tapOn: Remove from Group
- waitForAnimationToEnd
- assertNotVisible: Blake
- tapOn: Add Member
- waitForAnimationToEnd
# Typed in capitals, which the keyboard keeps, so only a match that ignores case finds Blake.
- inputText: BLAKE
- pressKey: Enter
- assertVisible: Add Blake Back?
- tapOn: Add Back
- waitForAnimationToEnd
- assertVisible: Blake
# Dragging the sheet down by its title closes it, whatever its height.
- swipe:
    from:
      text: Members
    direction: DOWN
- waitForAnimationToEnd
- assertNotVisible: Taylor (You)
- assertVisible: No expenses in this group yet.
# The group's title is a button that opens Rename Group.
- tapOn: Brisbane
- waitForAnimationToEnd
- assertVisible: Rename Group
# The name field has the focus and holds the group's name.
- eraseText: 20
- inputText: Tokyo
- tapOn: Save
- waitForAnimationToEnd
- assertNotVisible: Rename Group
- assertVisible: Tokyo

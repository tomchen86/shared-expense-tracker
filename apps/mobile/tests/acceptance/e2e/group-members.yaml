appId: com.tomchen.sharedexpensetracker
name: '[GROUPS-20.2] [GROUPS-22.3] [GROUPS-23.2] [GROUPS-24.2] [GROUPS-29.2] [GROUPS-31.2] Opens Members from the Group actions menu, adds two members in its name field, and swipes Members down'
---
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Brisbane"}]}'
- tapOn: Groups
- tapOn: Open Brisbane
- assertVisible: No expenses in this group yet.
# The native menu opens from its button, which is named after the menu.
- tapOn: Group actions
- tapOn: Members
- waitForAnimationToEnd
- assertVisible: Taylor (You)
- tapOn: Add Member
- waitForAnimationToEnd
# The name field in Members has the focus, so the keyboard types into it.
- inputText: Blake
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: Blake
# The field is empty and keeps the focus, so the next name goes straight in.
- inputText: Casey
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible: Casey
# Dragging the sheet down by its title closes it, whatever its height.
- swipe:
    from:
      text: Members
    direction: DOWN
- waitForAnimationToEnd
- assertNotVisible: Taylor (You)
- assertVisible: No expenses in this group yet.

appId: com.tomchen.sharedexpensetracker
name: '[SHELL-69.1] Swiping a card or a category row all the way left does what its revealed action does, and a short swipe only reveals it'
tags:
  - android
---
# Eight cards and seven groups, so that one is under the middle of any screen: this also runs on the
# small Android screen of scripts/e2e-android.sh, where the first card sits elsewhere.
- runFlow:
    file: common/launch-with-seed.yaml
    env:
      SEED: '{"name":"Taylor","groups":[{"name":"Group 1"},{"name":"Group 2"},{"name":"Group 3"},{"name":"Group 4"},{"name":"Group 5"},{"name":"Group 6"},{"name":"Group 7"}],"expenses":[{"title":"Card 1","amount":"1"},{"title":"Card 2","amount":"1"},{"title":"Card 3","amount":"1"},{"title":"Card 4","amount":"1"},{"title":"Card 5","amount":"1"},{"title":"Card 6","amount":"1"},{"title":"Card 7","amount":"1"},{"title":"Card 8","amount":"1"}]}'
# A short swipe only reveals the action. It stays short of 60% of the card on a 360 dp screen too.
- swipe:
    start: 85%, 50%
    end: 35%, 50%
    duration: 300
- waitForAnimationToEnd
- copyTextFrom:
    text: Delete .* expense
    enabled: true
- evalScript: ${output.card = maestro.copiedText.slice('Delete '.length, -' expense'.length)}
- assertVisible: ${output.card}, .*
- assertNotVisible: Moved to Trash
- swipe:
    start: 28%, 50%
    end: 60%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Delete .* expense
    enabled: true
# All the way to the left runs it. Its notice closes after 5 seconds, which a slow runner can use
# up before it presses Undo, so this only checks that Undo shows; other flows press it.
- swipe:
    start: 90%, 50%
    end: 3%, 50%
    duration: 500
- assertVisible: Undo deletion of ${output.card}
- assertVisible: Moved to Trash
- assertNotVisible: ${output.card}, .*
- tapOn: Groups
- waitForAnimationToEnd
- swipe:
    start: 85%, 50%
    end: 35%, 50%
    duration: 300
- waitForAnimationToEnd
- copyTextFrom:
    text: Archive .*
    enabled: true
- evalScript: ${output.group = maestro.copiedText.slice('Archive '.length)}
- swipe:
    start: 28%, 50%
    end: 60%, 50%
    duration: 250
- waitForAnimationToEnd
- assertNotVisible:
    text: Archive .*
    enabled: true
- swipe:
    start: 90%, 50%
    end: 3%, 50%
    duration: 500
- waitForAnimationToEnd
- assertVisible: Group archived.*
- assertNotVisible: Open ${output.group}.*
- tapOn: Settings
- waitForAnimationToEnd
- tapOn: Manage Categories
- waitForAnimationToEnd
- swipe:
    start: 90%, 50%
    end: 3%, 50%
    duration: 500
- waitForAnimationToEnd
- assertVisible: Delete Category\?
# The swipe closes the row, as pressing the revealed button does.
- assertNotVisible:
    text: Remove
    enabled: true
- tapOn: Cancel
- waitForAnimationToEnd
- assertVisible: Shopping

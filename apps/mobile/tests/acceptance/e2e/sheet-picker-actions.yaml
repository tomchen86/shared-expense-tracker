appId: com.tomchen.sharedexpensetracker
name: '[SHELL-65.1] Split Between keeps Done on the right and preserves multiple selections'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- tapOn: Groups
- tapOn: Add group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- tapOn: Open Brisbane
- tapOn: Group actions
- tapOn: Members
- tapOn: Add Member
- inputText: Casey
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: Close
- waitForAnimationToEnd
- tapOn: Add expense
- waitForAnimationToEnd
- scrollUntilVisible:
    element: Split between, Choose people
    direction: DOWN
    centerElement: true
- tapOn: Split between, Choose people
- waitForAnimationToEnd
- assertVisible: Split Between
# The screenshot also supports the manual short-sheet/material checks.
- takeScreenshot: split-between-initial
- assertVisible:
    text: Done
    rightOf:
      text: Split Between
- tapOn: Taylor \(You\)
- tapOn: Casey
- assertVisible:
    text: Taylor \(You\)
    selected: true
- assertVisible:
    text: Casey
    selected: true
- tapOn: Done
- waitForAnimationToEnd
- assertVisible: Split between, 2 people
- tapOn: Split between, 2 people
- assertVisible:
    text: Taylor \(You\)
    selected: true
- assertVisible:
    text: Casey
    selected: true

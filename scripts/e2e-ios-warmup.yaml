appId: com.tomchen.sharedexpensetracker
name: Warm-up of a new simulator, not a test
---
# scripts/e2e-ios.sh runs this before the flows on a simulator it created, and ignores the result.
# A new simulator stalls the first time it shows the keyboard, a sheet or a menu, or takes a swipe:
# UIKit has logged gestures blocked for half a minute then. Each step here does one of those.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: Expenses
      selected: true
    timeout: 120000
- tapOn: Settings
- tapOn: Enter your name
- inputText: Taylor
- pressKey: Enter
- tapOn: Groups
- tapOn: Add group
- waitForAnimationToEnd
- inputText: Brisbane
- tapOn: Create
- waitForAnimationToEnd
- swipe:
    from:
      text: Open Brisbane
    direction: LEFT
- waitForAnimationToEnd
- tapOn: Expenses
- tapOn: Add expense
- waitForAnimationToEnd
- tapOn: Expense title
- inputText: Dinner
- tapOn: Category, Food & Dining
- waitForAnimationToEnd
